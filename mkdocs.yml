site_name: Hospora ERP - User Guide
site_description: Step-by-step guide to Hospora ERP, a hospital management system built on Oracle APEX.
site_url: https://devvinish.github.io/hospora-docs/
repo_url: https://github.com/devvinish/hospora-docs
repo_name: hospora-docs
edit_uri: edit/main/docs/
copyright: Hospora ERP - Hospital Management System. Every name, number and record in the pictures is invented.

theme:
  name: material
  language: en
  icon:
    logo: material/hospital-box-outline
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - toc.follow
    - toc.integrate
    - content.action.edit

extra_css:
  - assets/extra.css

plugins:
  - search
  - glightbox:
      zoomable: true
      draggable: false
      skip_classes:
        - no-zoom

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - First-time Setup: getting-started/setup.md
      - Installation: getting-started/install.md
  - Registration:
      - registration/index.md
      - Find Patient: registration/find-patient.md
      - New O.P. Registration: registration/op-registration.md
      - Renew Registration: registration/renewal.md
      - I.P. Admission: registration/admission.md
      - Bed Board and Ward Transfers: registration/beds.md
      - Patient History: registration/patient-history.md
      - Prescriptions: registration/prescriptions.md
      - Certificates: registration/certificates.md
  - Appointments:
      - appointments/index.md
      - Book Appointment: appointments/book.md
      - Doctor Schedules and Leave: appointments/schedules.md
  - Clinical:
      - clinical/index.md
      - Consultations and Clinical Record: clinical/consultations.md
      - In the Wards: clinical/inpatient.md
      - Operations and Casualty: clinical/operations.md
      - Blood Bank: clinical/blood-bank.md
      - Mother and Child: clinical/mother-child.md
      - Consents and Forms: clinical/forms.md
  - Finance:
      - finance/index.md
      - Bills: finance/bills.md
      - In-Patient Billing and Dues: finance/inpatient-billing.md
      - The End of the Day: finance/day-end.md
      - Insurance and Packages: finance/insurance.md
      - Doctor and Referral Shares: finance/shares.md
      - Rates and Discounts: finance/rates.md
      - GST and the Accounts: finance/gst-accounts.md
  - Investigation:
      - investigation/index.md
      - The Laboratory: investigation/laboratory.md
      - X-Ray and Ultrasound: investigation/radiology.md
      - Laboratory Settings: investigation/lab-settings.md
  - Pharmacy:
      - pharmacy/index.md
      - Selling Medicines: pharmacy/selling.md
      - Medicines and Stock: pharmacy/stock.md
      - Buying Medicines: pharmacy/buying.md
  - Reports:
      - reports/index.md
      - Registration and Admission: reports/registration.md
      - Money: reports/finance.md
      - Pharmacy: reports/pharmacy.md
      - Clinical: reports/clinical.md
  - Masters:
      - masters/index.md
      - Hospital and Tariff: masters/tariff.md
      - Pharmacy Lists: masters/pharmacy.md
      - Report Formats: masters/formats.md
      - Clinical Lists: masters/clinical.md
  - Administration:
      - administration/index.md
      - Users and Roles: administration/users.md
      - Hospital Settings: administration/settings.md
      - Logs: administration/logs.md
  - Workflows: workflows/index.md
  - FAQ: faq.md
